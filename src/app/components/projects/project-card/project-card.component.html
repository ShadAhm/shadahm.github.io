<div class="card" *ngIf="repo">
  <h2 class="subsection-title">{{repo.name}}</h2>
  <p class="mt-1 text-ink-700">{{repo.description}}</p>
  <div class="mt-3 flex flex-wrap items-center gap-x-4 gap-y-2 text-sm">
    <a [href]="repo.html_url">View Repository</a>
    <a *ngIf="data.hasDemo" [href]="repo.homepage">View Demo</a>
    <a class="flex items-center gap-1.5" *ngIf="repo.stargazers_count > 0" [href]="repo.html_url + '/stargazers'">
      <app-icon name="star" [size]="14"></app-icon>{{repo.stargazers_count}}
    </a>
    <a class="flex items-center gap-1.5" *ngIf="repo.forks_count > 0" [href]="repo.html_url + '/network/members'">
      <app-icon name="git-branch" [size]="14"></app-icon>{{repo.forks_count}}
    </a>
  </div>
</div>
