<div class="card flex flex-col overflow-hidden p-0" *ngIf="repo">
  <div class="h-40 sm:h-48 shrink-0 bg-ink-100 print:hidden" *ngIf="thumbnailUrl && !screenshotFailed">
    <img
      class="h-full w-full object-cover"
      [src]="thumbnailUrl"
      [alt]="'Screenshot of the ' + repo.name + ' demo'"
      loading="lazy"
      decoding="async"
      (error)="screenshotFailed = true" />
  </div>

  <div class="flex flex-1 flex-col p-5 sm:p-6">
    <h2 class="subsection-title">{{repo.name}}</h2>
    <p class="mt-1 text-ink-700">{{repo.description}}</p>

    <ul class="mt-3 flex flex-wrap gap-1.5" *ngIf="data.tags?.length">
      <li class="badge badge-neutral" *ngFor="let tag of data.tags">{{tag}}</li>
    </ul>

    <div class="mt-4 flex flex-wrap items-center gap-x-4 gap-y-2 text-sm">
      <a class="btn btn-primary" *ngIf="demoUrl" [href]="demoUrl">
        <app-icon name="external-link" [size]="14"></app-icon>View Demo
      </a>
      <a class="btn btn-outline" [href]="repo.html_url">
        <app-icon name="github" [size]="14"></app-icon>Source
      </a>
      <a class="meta flex items-center gap-1.5" *ngIf="repo.stargazers_count > 0" [href]="repo.html_url + '/stargazers'">
        <app-icon name="star" [size]="14"></app-icon>{{repo.stargazers_count}}
      </a>
      <a class="meta flex items-center gap-1.5" *ngIf="repo.forks_count > 0" [href]="repo.html_url + '/network/members'">
        <app-icon name="git-branch" [size]="14"></app-icon>{{repo.forks_count}}
      </a>
    </div>
  </div>
</div>

<!-- Placeholder shown while the GitHub API response is in flight. -->
<div class="card overflow-hidden p-0" *ngIf="!repo" aria-hidden="true">
  <div class="h-40 sm:h-48 animate-pulse bg-ink-200"></div>
  <div class="animate-pulse space-y-3 p-5 sm:p-6">
    <div class="h-5 w-1/3 rounded bg-ink-200"></div>
    <div class="h-4 w-full rounded bg-ink-100"></div>
    <div class="h-4 w-2/3 rounded bg-ink-100"></div>
    <div class="flex gap-3 pt-1">
      <div class="h-4 w-24 rounded bg-ink-100"></div>
      <div class="h-4 w-16 rounded bg-ink-100"></div>
    </div>
  </div>
</div>
