<div class="grid gap-4 sm:grid-cols-2">

    <h2 class="section-title mb-2">Professional Projects</h2>
    <p class="flex-1 text-ink-700">
      The projects/products I have worked in during my professional experience as Software Developer or Consultant.
    </p>
    <div class="mt-4">
      <a routerLink="/pro-projects" class="btn btn-primary">
        View<app-icon name="chevron-right" [size]="14"></app-icon>
      </a>
    </div>
  </div>

  <div class="card flex flex-col">
    <h2 class="section-title mb-2">Pet Projects</h2>
    <p class="flex-1 text-ink-700">Some things I have worked on in my spare-time.</p>
    <div class="mt-4">
      <a routerLink="/pet-projects" class="btn btn-primary">
        View<app-icon name="chevron-right" [size]="14"></app-icon>
      </a>
    </div>
  </div>
</div>
